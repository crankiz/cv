name: CI

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: rojopolis/spellcheck-github-actions@v0
        name: Spellcheck
        with:
          source_files: README.md
          
      - uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_dir: docs
          output_dir: pdfs
          build_html: false
      
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: pdfs
